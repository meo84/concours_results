[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "concours-results"
version = "0.1.0"
description = "Tools for importing and processing concours results"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "ruff~=0.16.8"
]

[tool.setuptools.packages.find]
include = ["services*"]
