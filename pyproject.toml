[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "concours-results"
version = "0.1.0"
description = "Tools for importing and processing concours results"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["ruff~=0.16.8"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E", "W", "N", "D100", "D205", "D209"]
